[build-system]
requires = ["setuptools>=62.3"]  # `**` recursive globs in package-data
build-backend = "setuptools.build_meta"

[project]
name = "olit"
version = "0.0.0"
description = "olit agent brain (client-only Galaxy co-scientist)"
dependencies = ["numpy", "pandas", "pydantic", "PyYAML", "jsonschema"]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Galaxy Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-jsonschema",
    "pandas-stubs",
    "pytest",
    "pytest-asyncio",
    "aiohttp",
]

# Vendored from galaxy-skills at build time and re-fetched from a pinned sha, so formatting
# it here is both a divergence from upstream and wiped by the next vendor.
[tool.black]
line-length = 120
target-version = ["py312"]
force-exclude = "olit/skills/galaxy-skills/"

[tool.ruff]
line-length = 120
extend-exclude = ["olit/skills/galaxy-skills"]

[tool.ruff.lint]
select = ["E", "F", "I"]

# Text the model reads verbatim: prompts, ported tool descriptions and hint strings. Reflowing
# them would rewrite what is sent rather than how it is laid out.
[tool.ruff.lint.per-file-ignores]
"olit/compaction.py" = ["E501"]
"olit/loop/galaxy_tool_docs.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
# A process's parameter annotations are matched by identity to build the JSON schema the model
# reads (processes/__init__.py), so `str` cannot become `str | None` without changing the
# advertised type. These signatures mean implicit Optional and have to keep saying so.
no_implicit_optional = false
# Vendored third-party scripts, run inside a skill rather than imported by olit.
exclude = "^olit/skills/"

[[tool.mypy.overrides]]
# A process attaches its metadata to the function object and processes.py reads it back with
# getattr, so neither side declares these attributes.
module = ["olit.processes.*"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# Supplied by the Pyodide runtime, so they exist in the browser and never under CPython.
module = ["js", "js.*", "pyodide", "pyodide.*", "pyodide_js"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["olit*"]

[tool.setuptools.package-data]
# Skills are nested corpora (skills/<repo>/<skill>/SKILL.md plus the reference and
# example files a SKILL.md points at), so the glob has to recurse.
"olit.skills" = ["**/*"]
"olit.vendor" = ["*.json"]
# The node driver is how an installed brain reaches galaxy-ops outside the browser.
"olit.substrate" = ["*.mjs"]
