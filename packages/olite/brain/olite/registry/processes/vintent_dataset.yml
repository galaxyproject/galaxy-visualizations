version: 1
id: vintent_dataset
kind: agent_pipeline
description: Turn a natural-language request plus a tabular dataset into a chart (Vega-Lite).
when_to_use: when the user asks to visualize, chart, plot, or graph a tabular dataset (histogram, scatter, bar chart, distribution, correlation, trend, and so on)

# Least privilege: reads one dataset and reasons about it. No writes, no Pyodide —
# the transforms are materializers in the graph, not local code. Intersected with the
# session grant at invocation, so a write-enabled session cannot leak write in here.
capabilities: ["llm", "read"]

start: fetch

inputs:
  dataset_id:
    type: string
    required: true
  request:
    type: string
    required: true

state:
  raw:
    type: string
  values:
    type: array
  profile:
    type: object
  intent:
    type: object
  extract_choice:
    type: object
  shell_id:
    type: string
  params:
    type: object
  spec:
    type: object
  title:
    type: string

nodes:
  # 1. Fetch the dataset content (read) through the scoped catalog and profile it.
  fetch:
    type: executor
    run:
      op: api.call
      target: galaxy.datasets.show.display.get
      input:
        history_content_id:
          $ref: inputs.dataset_id
    emit:
      state.raw: result
    next: profile

  profile:
    type: materializer
    target: vintent.profile
    args:
      text:
        $ref: state.raw
    emit:
      state.values:
        $ref: result.values
      state.profile:
        $ref: result.profile
    next: parse_intent

  # 2. Understand the request: analytical goal + which fields are for the chart vs filtering.
  parse_intent:
    type: planner
    output_mode: json
    output_schema:
      $build: vintent.parse_intent_schema
      args:
        profile:
          $ref: state.profile
    prompt: Extract the user's analytical intent from the request.
    input:
      request:
        $ref: inputs.request
    emit:
      state.intent:
        $ref: result
    next: choose_extract

  # 3. Optionally pick one extraction step (filter/sort/sample/rank), or none.
  choose_extract:
    type: planner
    output_mode: json
    output_schema:
      $build: vintent.choose_process_schema
      args:
        profile:
          $ref: state.profile
    prompt: Choose an optional data extraction step, or "none" if the request needs no filtering.
    input:
      request:
        $ref: inputs.request
    emit:
      state.extract_choice:
        $ref: result
    next: apply_extract

  apply_extract:
    type: materializer
    target: vintent.run_process
    args:
      choice:
        $ref: state.extract_choice
      values:
        $ref: state.values
    emit:
      state.values:
        $ref: result.values
      state.profile:
        $ref: result.profile
    next: choose_shell

  # 4. Choose the chart shell from the ones applicable to the profile.
  choose_shell:
    type: planner
    output_mode: json
    output_schema:
      $build: vintent.choose_shell_schema
      args:
        profile:
          $ref: state.profile
        intent:
          $ref: state.intent
    prompt: Choose the most appropriate visualization shell for the request.
    input:
      request:
        $ref: inputs.request
    emit:
      state.shell_id:
        $ref: result.shellId
    next: fill_params

  # 5. Fill the shell's encoding parameters (which field is x, y, color, ...).
  fill_params:
    type: planner
    output_mode: json
    output_schema:
      $build: vintent.fill_params_schema
      args:
        shell_id:
          $ref: state.shell_id
        profile:
          $ref: state.profile
        intent:
          $ref: state.intent
    prompt: Fill the parameters for the chosen visualization shell.
    input:
      request:
        $ref: inputs.request
    emit:
      state.params:
        $ref: result
    next: analyze

  # 6. Run the shell's analyze processes (binning, aggregation, regression, ...).
  analyze:
    type: materializer
    target: vintent.analyze
    args:
      shell_id:
        $ref: state.shell_id
      values:
        $ref: state.values
      params:
        $ref: state.params
    emit:
      state.values:
        $ref: result.values
      state.profile:
        $ref: result.profile
    next: compile

  # 7. Validate the params against the profile, then compile the Vega-Lite spec.
  compile:
    type: materializer
    target: vintent.compile
    args:
      shell_id:
        $ref: state.shell_id
      values:
        $ref: state.values
      params:
        $ref: state.params
      profile:
        $ref: state.profile
    emit:
      state.spec:
        $ref: result.spec
      state.title:
        $ref: result.title
    next: done

  # 8. Return the chart as a typed artifact (rendered by the shell, not dumped to chat).
  done:
    type: terminal
    output:
      artifact:
        kind: vega-lite
        title:
          $ref: state.title
        spec:
          $ref: state.spec
