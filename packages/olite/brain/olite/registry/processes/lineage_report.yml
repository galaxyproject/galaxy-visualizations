version: 1
id: lineage_report
kind: agent_pipeline
description: Reconstruct a dataset's upstream provenance (datasets + jobs) and summarize how it was produced.
when_to_use: when the user asks how a dataset was made, its lineage, provenance, or the steps that produced it

# Least privilege: walks datasets and jobs read-only and narrates them. Provenance is
# a pure read; this process must never be able to modify the history it inspects.
capabilities: ["llm", "read"]

start: fetch_source_dataset

inputs:
  dataset_id:
    type: string
    required: true
  depth:
    type: integer
  max_per_level:
    type: integer

state:
  source_dataset:
    type: object
  datasets:
    type: array
  jobs:
    type: array
  truncated:
    type: boolean
  summary:
    type: string
  mermaid:
    type: string

nodes:
  # 1. Fetch the dataset the user is asking about (the traversal seed).
  fetch_source_dataset:
    type: executor
    run:
      op: api.call
      target: galaxy.datasets.show.get
      input:
        dataset_id:
          $ref: inputs.dataset_id
    emit:
      state.source_dataset: result
    next: traverse_upstream

  # 2. Walk upstream: dataset -> creating_job -> inputs/outputs (the lineage graph).
  traverse_upstream:
    type: traverse
    seed:
      $ref: state.source_dataset
    seed_type: dataset
    max_depth:
      $ref: inputs.depth
    max_per_level:
      $ref: inputs.max_per_level
    types:
      dataset:
        id_field: id
        dedup_field: uuid
        fetch:
          target: galaxy.datasets.show.get
          id_param: dataset_id
        relations:
          creating_job:
            type: job
            extract: creating_job
      job:
        id_field: id
        fetch:
          target: galaxy.jobs.show.get
          id_param: job_id
        relations:
          inputs:
            type: dataset
            extract: inputs.*
          outputs:
            type: dataset
            extract: outputs.*
    emit:
      state.datasets:
        $ref: result.dataset
      state.jobs:
        $ref: result.job
      state.truncated: truncated
    next: summarize

  # 3. Narrate the pipeline from the collected datasets and jobs.
  summarize:
    type: reasoning
    prompt: |
      Describe, in a short paragraph, how the source dataset was produced.
      Use only the tools that actually appear in the jobs (tool_id); do not invent
      steps. Mention input and output data where apparent. Exclude internal Galaxy
      tools whose id starts with "__".
    input:
      datasets:
        $ref: state.datasets
      jobs:
        $ref: state.jobs
    emit:
      state.summary:
        $ref: result
    next: diagram

  # 4. Render the lineage as a Mermaid flowchart (deterministic, no LLM).
  diagram:
    type: materializer
    target: lineage.mermaid
    args:
      datasets:
        $ref: state.datasets
      jobs:
        $ref: state.jobs
      source_dataset_id:
        $ref: inputs.dataset_id
    emit:
      state.mermaid:
        $ref: result
    next: done

  # 5. Return the lineage and the narrative to the model; the diagram goes out of
  #    band as a typed artifact, so the flowchart source never enters the context.
  done:
    type: terminal
    output:
      datasets:
        $ref: state.datasets
      jobs:
        $ref: state.jobs
      truncated:
        $ref: state.truncated
      summary:
        $ref: state.summary
      artifact:
        kind: mermaid
        title: Dataset lineage
        diagram:
          $ref: state.mermaid
