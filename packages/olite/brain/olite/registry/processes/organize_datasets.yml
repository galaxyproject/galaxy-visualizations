version: 1
id: organize_datasets
kind: agent_pipeline
description: Group loose datasets in a history into a collection, tag it, and set their datatype.
when_to_use: when the user asks to organise, group, or collect loose datasets in a history, to build a collection from files that arrived separately, or to tag or set the datatype of a set of datasets

# Least privilege: reads the history, writes only collections and their tags.
capabilities: ["read", "write"]

start: list_contents

inputs:
  history_id:
    type: string
    required: true
  collection_name:
    type: string
    default: Collection
  # Filename glob. Anything outside it is left untouched, which is how a non-read file
  # escapes the datatype write.
  include:
    type: string
    default: "*"
  structure:
    type: string
    default: auto
  datatype:
    type: string
  tags:
    type: array

state:
  contents:
    type: array
  grouping:
    type: object
  collection:
    type: object
  leftovers:
    type: object
  tagged:
    type: object

nodes:
  # What is in the history, unhidden and undeleted.
  list_contents:
    type: executor
    run:
      op: api.call
      target: galaxy.histories.show.contents.get
      input:
        history_id:
          $ref: inputs.history_id
        v: dev
        deleted: false
        visible: true
    emit:
      state.contents: result
    next: group

  # Partition into elements, leftovers and out-of-scope; see collections.group.
  group:
    type: materializer
    target: collections.group
    args:
      datasets:
        $ref: state.contents
      structure:
        $ref: inputs.structure
      include:
        $ref: inputs.include
    emit:
      state.grouping: result
    next: is_empty

  is_empty:
    type: control
    condition:
      op: control.branch
      cases:
        - when:
            state.grouping.empty: true
          next: nothing_to_do
      default: needs_datatype

  needs_datatype:
    type: control
    condition:
      op: control.branch
      cases:
        - when:
            inputs.datatype: null
          next: build_collection
      default: set_datatype

  # One bulk call for every in-scope dataset, leftovers included.
  set_datatype:
    type: executor
    run:
      op: api.call
      target: galaxy.histories.show.contents.bulk.put
      input:
        history_id:
          $ref: inputs.history_id
        operation: change_datatype
        items:
          $ref: state.grouping.items
        params:
          type: change_datatype
          datatype:
            $ref: inputs.datatype
    next: build_collection

  build_collection:
    type: executor
    run:
      op: api.call
      target: galaxy.dataset_collections.post
      input:
        history_id:
          $ref: inputs.history_id
        name:
          $ref: inputs.collection_name
        collection_type:
          $ref: state.grouping.structure
        element_identifiers:
          $ref: state.grouping.elements
        type: dataset_collection
    emit:
      state.collection: result
    next: has_leftovers

  has_leftovers:
    type: control
    condition:
      op: control.branch
      cases:
        - when:
            state.grouping.has_leftovers: true
          next: build_leftovers
      default: needs_tags

  # Files that did not pair get their own collection rather than being dropped.
  build_leftovers:
    type: executor
    run:
      op: api.call
      target: galaxy.dataset_collections.post
      input:
        history_id:
          $ref: inputs.history_id
        name: Unpaired
        collection_type: list
        element_identifiers:
          $ref: state.grouping.leftovers
        type: dataset_collection
    emit:
      state.leftovers: result
    next: needs_tags

  needs_tags:
    type: control
    condition:
      op: control.branch
      cases:
        - when:
            inputs.tags: []
          next: done
        - when:
            inputs.tags: null
          next: done
      default: tag_collection

  # Bulk again: tags belong to the collection, which the per-dataset tag route
  # cannot address.
  tag_collection:
    type: executor
    run:
      op: api.call
      target: galaxy.histories.show.contents.bulk.put
      input:
        history_id:
          $ref: inputs.history_id
        operation: add_tags
        items:
          - id:
              $ref: state.collection.id
            history_content_type: dataset_collection
        params:
          type: add_tags
          tags:
            $ref: inputs.tags
    emit:
      state.tagged: result
    next: done

  nothing_to_do:
    type: terminal

  done:
    type: terminal
