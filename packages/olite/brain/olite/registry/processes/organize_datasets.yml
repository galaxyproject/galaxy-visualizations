version: 1
id: organize_datasets
kind: agent_pipeline
description: Group loose datasets in a history into a collection, tag it, and set their datatype.
when_to_use: when the user asks to organise, group, or collect loose datasets in a history, to build a collection from files that arrived separately, or to tag or set the datatype of a set of datasets

# Least privilege: reads the history, writes only a collection and its tags.
capabilities: ["read", "write"]

start: list_contents

inputs:
  history_id:
    type: string
  collection_name:
    type: string
    default: Collection
  structure:
    type: string
    default: auto
  datatype:
    type: string
  tags:
    type: array

state:
  contents:
    type: array
  grouping:
    type: object
  retyped:
    type: object
  collection:
    type: object
  tagged:
    type: array

nodes:
  # What is in the history, unhidden and undeleted.
  list_contents:
    type: executor
    run:
      op: api.call
      target: galaxy.histories.show.contents.get
      input:
        history_id:
          $ref: inputs.history_id
        v: dev
        deleted: false
        visible: true
    emit:
      state.contents: result
    next: group

  # Pair or list them; the rule lives in collections.group.
  group:
    type: materializer
    target: collections.group
    args:
      datasets:
        $ref: state.contents
      structure:
        $ref: inputs.structure
    emit:
      state.grouping: result
    next: needs_datatype

  # Datatype is optional; only write one when the caller asked for it.
  needs_datatype:
    type: control
    condition:
      op: control.branch
      cases:
        - when:
            inputs.datatype: null
          next: build_collection
      default: set_datatype

  # One bulk call retypes every dataset, whatever the collection ends up looking like.
  set_datatype:
    type: executor
    run:
      op: api.call
      target: galaxy.histories.show.contents.bulk.put
      input:
        history_id:
          $ref: inputs.history_id
        operation: change_datatype
        items:
          $ref: state.grouping.items
        params:
          type: change_datatype
          datatype:
            $ref: inputs.datatype
    emit:
      state.retyped: result
    next: build_collection

  # One collection from the grouping.
  build_collection:
    type: executor
    run:
      op: api.call
      target: galaxy.dataset_collections.post
      input:
        history_id:
          $ref: inputs.history_id
        name:
          $ref: inputs.collection_name
        collection_type:
          $ref: state.grouping.structure
        element_identifiers:
          $ref: state.grouping.elements
        type: dataset_collection
    emit:
      state.collection: result
    next: needs_tags

  # Tags are optional too.
  needs_tags:
    type: control
    condition:
      op: control.branch
      cases:
        - when:
            inputs.tags: []
          next: done
        - when:
            inputs.tags: null
          next: done
      default: tag_collection

  # Bulk again: the tags belong to the collection, which the per-dataset tag route
  # cannot address.
  tag_collection:
    type: executor
    run:
      op: api.call
      target: galaxy.histories.show.contents.bulk.put
      input:
        history_id:
          $ref: inputs.history_id
        operation: add_tags
        items:
          - id:
              $ref: state.collection.id
            history_content_type: dataset_collection
        params:
          type: add_tags
          tags:
            $ref: inputs.tags
    emit:
      state.tagged: result
    next: done

  done:
    type: terminal
