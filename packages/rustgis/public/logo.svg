  <circle cx="256" cy="256" r="184" fill="#FFFFFF"/>
  <!-- Globe: four segments split by a curved meridian and a tilted parallel -->
  <g clip-path="url(#globe)">
    <path d="M60,60 L250,60 C215,150 205,230 214,262 C150,250 100,262 60,282 Z" fill="url(#blue)"/>
    <path d="M250,60 L452,60 L452,226 C380,236 300,250 214,262 C205,230 215,150 250,60 Z" fill="url(#teal)"/>
    <path d="M60,282 C100,262 150,250 214,262 C222,330 250,400 280,452 L60,452 Z" fill="url(#green)"/>
    <path d="M214,262 C300,250 380,236 452,226 L452,452 L280,452 C250,400 222,330 214,262 Z" fill="url(#gold)"/>
    <!-- White gaps -->
    <path d="M250,60 C215,150 205,230 214,262 C222,330 250,400 280,452" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <path d="M60,282 C100,262 150,250 214,262 C300,250 380,236 452,226" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <!-- Latitude lines -->
    <path d="M70,170 C170,135 330,125 440,150" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"/>
    <path d="M75,360 C180,345 330,335 440,345" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"/>
  </g>
  <!-- Orbit: the front half of a tilted ellipse, ending in a node -->
  <g transform="rotate(-28 256 256)">
    <path d="M30,256 A226,70 0 0,0 482,256" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <path d="M30,256 A226,70 0 0,0 482,256" fill="none" stroke="url(#rust)" stroke-width="11" stroke-linecap="round"/>
  </g>
  <circle cx="455.5" cy="149.9" r="22" fill="#FFFFFF"/>
  <circle cx="455.5" cy="149.9" r="14" fill="url(#rust)"/>
</svg>
