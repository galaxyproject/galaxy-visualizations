<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>RustGIS</title>
  <defs>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4783D"/>
      <stop offset="1" stop-color="#A83F24"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B8EDB"/>
      <stop offset="1" stop-color="#1F5FA8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22B5A2"/>
      <stop offset="1" stop-color="#0E8576"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CC84B"/>
      <stop offset="1" stop-color="#4E9A2E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8C150"/>
      <stop offset="1" stop-color="#E39A22"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="256" cy="256" r="166"/></clipPath>
  </defs>
