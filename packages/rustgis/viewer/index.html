<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>RustGIS</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #e4e8ee;
            }
            #rustgis_canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
            }
            #rustgis_loading {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                font:
                    16px system-ui,
                    sans-serif;
                color: #4a5563;
            }
        </style>
    </head>
    <body>
        <canvas id="rustgis_canvas" aria-label="RustGIS map and tools"></canvas>
        <div id="rustgis_loading" role="status"></div>
        <script type="module" src="./loader.js"></script>
    </body>
</html>
